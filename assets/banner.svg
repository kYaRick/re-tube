<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Re-Tube: the classic YouTube, refined">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141733"/>
      <stop offset="1" stop-color="#090a16"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#5cb3ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5cb3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cb3ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="win"><rect x="700" y="120" width="500" height="400" rx="22"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="260" cy="150" rx="420" ry="320" fill="url(#blobA)"/>
  <ellipse cx="1060" cy="560" rx="520" ry="360" fill="url(#blobB)"/>

  <!-- logo: a tube looping back into a play nozzle -->
  <g transform="translate(96 168) scale(1.35)">
    <path d="M 62 30 A 34 34 0 1 0 96 64" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="22" stroke-linecap="round" transform="translate(3 4)"/>
    <path d="M 62 30 A 34 34 0 1 0 96 64" fill="none" stroke="url(#tube)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 58 34 A 30 30 0 0 0 36 52" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
    <path d="M 62 16 L 92 30 L 62 44 Z" fill="url(#tube)" stroke="url(#tube)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 66 24 L 78 30 L 66 36 Z" fill="#fff"/>
    <path d="M 56 54 L 76 64 L 56 74 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <text x="96" y="420" fill="url(#text)" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-2">Re-Tube</text>
  <text x="100" y="474" fill="#a5b4fc" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="32" font-weight="500">The classic YouTube, refined.</text>
  <g font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#e0e7ff">
    <rect x="100" y="506" width="128" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="164" y="531" text-anchor="middle">Userscript</text>
    <rect x="240" y="506" width="104" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="292" y="531" text-anchor="middle">Presets</text>
    <rect x="356" y="506" width="140" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="426" y="531" text-anchor="middle">Open source</text>
  </g>

  <!-- stylised window: player, metadata card, recommendations, settings badge -->
  <rect x="700" y="120" width="500" height="400" rx="22" fill="#0d0f22" stroke="#ffffff" stroke-opacity=".12"/>
  <g clip-path="url(#win)">
    <rect x="700" y="120" width="500" height="40" fill="#ffffff" fill-opacity=".05"/>
    <circle cx="724" cy="140" r="6" fill="#ff5f57"/>
    <circle cx="744" cy="140" r="6" fill="#febc2e"/>
    <circle cx="764" cy="140" r="6" fill="#28c840"/>
    <rect x="860" y="131" width="200" height="18" rx="9" fill="#ffffff" fill-opacity=".08"/>

    <rect x="720" y="178" width="320" height="180" rx="14" fill="url(#tube)" opacity=".85"/>
    <path d="M 866 248 L 900 268 L 866 288 Z" fill="#fff"/>
    <rect x="720" y="372" width="320" height="58" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="736" y="388" width="200" height="10" rx="5" fill="#ffffff" fill-opacity=".55"/>
    <rect x="736" y="406" width="140" height="8" rx="4" fill="#ffffff" fill-opacity=".25"/>
    <rect x="720" y="442" width="320" height="64" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="736" y="456" width="4" height="36" rx="2" fill="#5cb3ff"/>
    <rect x="750" y="460" width="160" height="8" rx="4" fill="#ffffff" fill-opacity=".45"/>
    <rect x="750" y="476" width="240" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>

    <g fill="#ffffff">
      <rect x="1056" y="178" width="128" height="72" rx="10" fill-opacity=".12"/>
      <rect x="1056" y="258" width="96" height="8" rx="4" fill-opacity=".4"/>
      <rect x="1056" y="284" width="128" height="72" rx="10" fill-opacity=".12"/>
      <rect x="1056" y="364" width="80" height="8" rx="4" fill-opacity=".4"/>
      <rect x="1056" y="390" width="128" height="72" rx="10" fill-opacity=".12"/>
      <rect x="1056" y="470" width="104" height="8" rx="4" fill-opacity=".4"/>
    </g>
  </g>
  <g transform="translate(1130 470)">
    <rect width="92" height="92" rx="24" fill="#141733" stroke="#ffffff" stroke-opacity=".16"/>
    <g transform="translate(10 10) scale(.56)">
      <path d="M 62 30 A 34 34 0 1 0 96 64" fill="none" stroke="url(#tube)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 62 14 L 94 30 L 62 46 Z" fill="url(#tube)" stroke="url(#tube)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 56 52 L 78 64 L 56 76 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
